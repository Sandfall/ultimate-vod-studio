name: CI

# Runs the project's quality gates: ruff (lint) and mypy (types).
# Linux runners have real wheels for the native stack (torch/PyQt6/opencv/easyocr), so unlike a
# local macOS checkout this Just Works headlessly.
#
# Manual-only: trigger from the Actions tab ("Run workflow") or `gh workflow run ci.yml`. It does
# NOT run automatically on push/PR: the local quality gates (ruff/mypy) are the primary check;
# run CI here on demand when you want the hosted-runner confirmation.
on:
  workflow_dispatch:

# Newer pushes to the same ref cancel in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # matches local dev (3.13.x)
          cache: pip

      # PyQt6 (even offscreen) and OpenCV link against a few system libraries.
      - name: Install system libraries (Qt offscreen + OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libpulse0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch so CI doesn't download the multi-GB CUDA build. Installed first so the
          # editable install below sees torch already satisfied and won't pull the default wheel.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[gui,test]"
          pip install ruff==0.15.20 mypy==2.1.0

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy
